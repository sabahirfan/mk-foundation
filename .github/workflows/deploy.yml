name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Check the site URL is set
        if: ${{ vars.SITE_URL == '' }}
        run: echo "::warning::SITE_URL is not set, so canonical links and the sitemap point at a placeholder domain. Add it under Settings → Secrets and variables → Actions → Variables."
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Set this repository variable to the live domain, e.g. https://www.mkfoundation.org
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
